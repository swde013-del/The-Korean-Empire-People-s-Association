<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="google-site-verification" content="6wmgBtvoq2IRZiGoY9FspMBgcY7WtydQTK6HYss2iPE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한제국인민협회</title>
    <style>
        :root {
            --header-bg: #e60000;
            --header-text: #ffffff;
            --bg-color: #f8f9fa;
            --border-color: #000000;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. 상단 헤더 */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
            border-radius: 3px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-nav-btn {
            background-color: transparent;
            color: white;
            border: 2px solid white;
            padding: 0.4rem 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .auth-nav-btn:hover {
            background-color: rgba(255,255,255,0.2);
        }

        /* 2. 메인 비주얼 영역 */
        .hero-section {
            background-color: #ffffff;
            border-bottom: 2px solid var(--border-color);
            padding: 2.5rem 1rem;
            text-align: center;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero-image-box {
            width: 100%;
            max-width: 700px;
            height: 180px;
            margin: 0 auto;
            border: 2px dashed #888;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #555;
            border-radius: 6px;
        }

        /* 3. 본문 레이아웃 */
        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* 카운터 & 패치 카드 */
        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-value {
            font-size: 1.4rem;
            color: var(--header-bg);
            margin-top: 0.3rem;
        }

        .patch-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            min-height: 200px;
        }

        .patch-card h3 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        /* 게시글 영역 */
        .posts-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .posts-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .posts-card-header h2 {
            border: none;
            margin: 0;
            padding: 0;
        }

        /* 폼 및 입력 요소 */
        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 0.6rem;
            margin: 0.4rem 0 0.8rem 0;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--header-bg);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #cc0000;
        }

        .btn-secondary {
            background-color: #555;
        }

        /* 게시글 리스트 아이템 */
        .post-item {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .post-item:hover {
            background-color: #fafafa;
        }

        .post-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .post-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.6rem;
        }

        .post-img-preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 4px;
            margin-top: 0.5rem;
            display: block;
        }

        /* 상세 페이지 뷰 */
        #detail-view {
            display: none;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 1.5rem;
        }

        .comments-section {
            margin-top: 2rem;
            border-top: 2px solid #ddd;
            padding-top: 1.5rem;
        }

        /* 댓글 스타일 (왼쪽 프로필 + 오른쪽 내용) */
        .comment-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e60000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            flex-shrink: 0;
            border: 1px solid #000;
            overflow: hidden;
        }

        .comment-body {
            flex: 1;
        }

        .comment-meta {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 0.3rem;
            font-weight: bold;
        }

        .comment-time {
            font-weight: normal;
            color: #777;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        /* 모달 공통 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* 푸터 */
        footer {
            border-top: 2px solid var(--border-color);
            background: #ffffff;
            padding: 1rem;
            margin-top: auto;
        }

        .footer-top {
            display: flex;
            justify-content: flex-end;
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 0.5rem;
        }

        .contact-link {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-bottom {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding-top: 0.5rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 헤더 -->
    <header>
        <div class="logo-container" onclick="goHome()">
            <img src="logo.png" alt="대한제국 태극기 로고" class="logo-img">
            <span>대한제국인민협회</span>
        </div>
        <div class="header-right" id="auth-nav-area">
            <button class="auth-nav-btn" id="btn-open-auth">회원가입과 로그인</button>
        </div>
    </header>

    <!-- 2. 메인 비주얼 -->
    <section class="hero-section" id="hero-sec">
        <h1 class="hero-title">The Korean Empire People's Association</h1>
        <div class="hero-image-box">
            <span>이미지</span>
        </div>
    </section>

    <!-- 3. 본문 레이아웃 -->
    <div class="main-container" id="main-sec">
        <!-- 좌측 대시보드 -->
        <aside class="left-aside">
            <div class="stat-card">
                <div>현재 실시간 가입자수</div>
                <div class="stat-value" id="total-users-count">0 명</div>
            </div>

            <div class="stat-card">
                <div>현재 실시간 접속자 수</div>
                <div class="stat-value" id="online-users-count">1 명</div>
            </div>

            <div class="patch-card">
                <h3>패치 내용</h3>
                <ul style="padding-left: 1.2rem; font-size: 0.9rem; line-height: 1.8;">
                    <li>v1.3.0 비로그인 포함 전체 실시간 접속자 집계</li>
                    <li>비로그인 IP 표시 및 프로필 아바타 적용</li>
                    <li>게시글 상세 페이지 및 댓글 스크롤 기능</li>
                </ul>
            </div>
        </aside>

        <!-- 우측 작성한 글들 (메인 피드) -->
        <main class="posts-card" id="feed-view">
            <div class="posts-card-header">
                <h2>작성한 글들</h2>
                <button class="btn" id="btn-open-write">글 작성</button>
            </div>
            <div id="posts-list">
                <p>게시글을 불러오는 중입니다...</p>
            </div>
        </main>

        <!-- 상세 페이지 뷰 (글 클릭 시 전환) -->
        <main class="posts-card" id="detail-view">
            <button class="btn btn-secondary" onclick="goHome()" style="margin-bottom: 1rem; width: fit-content;">← 목록으로 돌아가기</button>
            <div id="detail-content-area"></div>
            
            <div class="comments-section">
                <h3>댓글</h3>
                <div id="detail-comments-list" style="margin-top: 1rem;">댓글을 불러오는 중...</div>
                
                <div id="comment-write-area" style="margin-top: 1.5rem;">
                    <textarea id="comment-text-input" rows="2" placeholder="댓글 내용을 입력하세요..."></textarea>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem;">
                        <input type="file" id="comment-file-input" accept="image/*" style="width: auto; margin:0;">
                        <button class="btn" id="btn-submit-comment">댓글 등록</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 글 작성 모달 -->
    <div class="modal" id="write-modal">
        <div class="modal-content">
            <h2>새로운 소식 작성</h2>
            <input type="text" id="post-title-input" placeholder="제목을 입력하세요">
            <textarea id="post-content-input" rows="5" placeholder="내용을 입력하세요..."></textarea>
            <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-top: 0.5rem;">이미지 / GIF 첨부:</label>
            <input type="file" id="post-file-input" accept="image/*">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-submit-post" style="flex:1;">게시하기</button>
                <button class="btn btn-secondary" id="btn-close-write" style="flex:1;">취소</button>
            </div>
        </div>
    </div>

    <!-- 로그인/가입 모달 -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2>로그인 / 회원가입</h2>
            <input type="email" id="auth-email" placeholder="이메일 주소">
            <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
            <input type="text" id="auth-nickname" placeholder="닉네임 (가입시에만 필요)">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-login" style="flex:1;">로그인</button>
                <button class="btn btn-secondary" id="btn-signup" style="flex:1;">회원가입</button>
            </div>
            <button id="btn-close-auth" style="margin-top: 1rem; width:100%; background:none; border:none; color:#666; cursor:pointer;">닫기</button>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        <div class="footer-top">
            <a href="mailto:swde013@gmail.com" class="contact-link">문의</a>
        </div>
        <div class="footer-bottom">
            대한제국인민협회
        </div>
    </footer>

    <!-- Firebase 및 앱 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, 
            onSnapshot, serverTimestamp, doc, setDoc, getDoc, getCountFromServer, deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCfC8wc2viAAKBXK5PHM9-jYYV6OfxI9o",
            authDomain: "korean-empire.firebaseapp.com",
            projectId: "korean-empire",
            storageBucket: "korean-empire.firebasestorage.app",
            messagingSenderId: "1059886832097",
            appId: "1:1059886832097:web:e5622134c671799db05aa0",
            measurementId: "G-2VXJ274Q5Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentPostId = null;
        let userIp = "IP: 127.0.0.1";

        // 세션 식별자 생성
        let sessionId = localStorage.getItem('site_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
            localStorage.setItem('site_session_id', sessionId);
        }

        // 공인 IP 조회
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { userIp = `IP: ${data.ip}`; })
            .catch(() => { userIp = "IP: 192.168.x.x"; });

        // DOM 요소
        const authModal = document.getElementById('auth-modal');
        const writeModal = document.getElementById('write-modal');
        const btnOpenAuth = document.getElementById('btn-open-auth');
        const btnCloseAuth = document.getElementById('btn-close-auth');
        const btnOpenWrite = document.getElementById('btn-open-write');
        const btnCloseWrite = document.getElementById('btn-close-write');
        const authNavArea = document.getElementById('auth-nav-area');
        const feedView = document.getElementById('feed-view');
        const detailView = document.getElementById('detail-view');
        const heroSec = document.getElementById('hero-sec');
        const postsList = document.getElementById('posts-list');
        const totalUsersEl = document.getElementById('total-users-count');
        const onlineUsersEl = document.getElementById('online-users-count');

        // 모달 제어
        btnOpenAuth.addEventListener('click', () => authModal.style.display = 'flex');
        btnCloseAuth.addEventListener('click', () => authModal.style.display = 'none');
        btnOpenWrite.addEventListener('click', () => writeModal.style.display = 'flex');
        btnCloseWrite.addEventListener('click', () => writeModal.style.display = 'none');

        window.goHome = () => {
            detailView.style.display = 'none';
            feedView.style.display = 'flex';
            heroSec.style.display = 'block';
            currentPostId = null;
            window.scrollTo(0, 0);
        };

        // ----------------------------------------------------
        // 🌐 비로그인 포함 실시간 접속자 수 (Heartbeat) 시스템
        // ----------------------------------------------------
        async function updateHeartbeat() {
            try {
                await setDoc(doc(db, "active_sessions", sessionId), {
                    lastSeen: serverTimestamp()
                });
            } catch (e) { console.log(e); }
        }

        // 10초마다 접속 신호 갱신
        updateHeartbeat();
        setInterval(updateHeartbeat, 10000);

        // 실시간 접속자 수 감지 (최근 30초 내 활동 세션 카운트)
        onSnapshot(collection(db, "active_sessions"), (snapshot) => {
            const now = Date.now();
            let activeCount = 0;
            snapshot.forEach((sessionDoc) => {
                const data = sessionDoc.data();
                if (data.lastSeen) {
                    const lastSeenTime = data.lastSeen.toDate().getTime();
                    if (now - lastSeenTime < 30000) { // 30초 이내 신호만 카운트
                        activeCount++;
                    }
                }
            });
            onlineUsersEl.textContent = `${Math.max(1, activeCount)} 명`;
        });

        // ----------------------------------------------------
        // 🔐 인증 및 게시글/댓글 로직
        // ----------------------------------------------------
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authModal.style.display = 'none';
                authNavArea.innerHTML = `
                    <span style="color:white; font-weight:bold; margin-right:5px;">${user.displayName || user.email.split('@')[0]}님</span>
                    <button class="auth-nav-btn" id="btn-logout">로그아웃</button>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            } else {
                authNavArea.innerHTML = `<button class="auth-nav-btn" id="btn-open-auth">회원가입과 로그인</button>`;
                document.getElementById('btn-open-auth').addEventListener('click', () => authModal.style.display = 'flex');
            }
            updateTotalUsersCount();
        });

        // 회원가입
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value || email.split('@')[0];

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: nickname });
                await setDoc(doc(db, "users", cred.user.uid), { email, nickname });
                alert('가입이 완료되었습니다!');
            } catch (err) {
                alert('가입 오류: ' + err.message);
            }
        });

        // 로그인
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인되었습니다.');
            } catch (err) {
                alert('로그인 오류: ' + err.message);
            }
        });

        // 실시간 가입자 수
        async function updateTotalUsersCount() {
            try {
                const snapshot = await getCountFromServer(collection(db, "users"));
                totalUsersEl.textContent = `${snapshot.data().count} 명`;
            } catch (e) { console.log(e); }
        }

        // 이미지 파일 Base64 변환
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 글 작성
        document.getElementById('btn-submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();
            const fileInput = document.getElementById('post-file-input');

            if (!title || !content) return alert('제목과 내용을 작성해 주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : userIp;

            try {
                await addDoc(collection(db, "posts"), {
                    title,
                    content,
                    imageUrl,
                    author: authorName,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-title-input').value = '';
                document.getElementById('post-content-input').value = '';
                fileInput.value = '';
                writeModal.style.display = 'none';
            } catch (e) {
                alert('게시 오류: ' + e.message);
            }
        });

        // 실시간 게시글 목록
        const qPosts = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(qPosts, (snapshot) => {
            postsList.innerHTML = '';
            if (snapshot.empty) {
                postsList.innerHTML = '<p style="color:#777;">작성된 글이 없습니다.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                const time = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';

                const postEl = document.createElement('div');
                postEl.className = 'post-item';
                postEl.onclick = () => openDetail(postId);
                postEl.innerHTML = `
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-meta">작성자: ${escapeHtml(post.author)} | ${time}</div>
                    <div style="white-space: pre-wrap; margin-bottom:0.5rem;">${escapeHtml(post.content)}</div>
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-img-preview">` : ''}
                `;
                postsList.appendChild(postEl);
            });
        });

        // 상세 페이지 열기
        window.openDetail = async (postId) => {
            currentPostId = postId;
            feedView.style.display = 'none';
            heroSec.style.display = 'none';
            detailView.style.display = 'block';

            const docRef = doc(db, "posts", postId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const post = docSnap.data();
                const time = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';
                
                document.getElementById('detail-content-area').innerHTML = `
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${escapeHtml(post.title)}</h2>
                    <div class="post-meta">작성자: ${escapeHtml(post.author)} | ${time}</div>
                    <div style="white-space: pre-wrap; margin: 1rem 0; font-size: 1.05rem; line-height: 1.6;">${escapeHtml(post.content)}</div>
                    ${post.imageUrl ? `<img src="${post.imageUrl}" style="max-width:100%; border-radius:6px; margin-top:1rem;">` : ''}
                `;
                loadComments(postId);
            } else {
                alert('존재하지 않는 게시글입니다.');
                goHome();
            }
            window.scrollTo(0, 0);
        };

        // 실시간 댓글 불러오기
        function loadComments(postId) {
            const commentsListEl = document.getElementById('detail-comments-list');
            const qComments = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
            
            onSnapshot(qComments, (snap) => {
                commentsListEl.innerHTML = '';
                if(snap.empty) {
                    commentsListEl.innerHTML = '<p style="color:#888; font-size:0.9rem;">작성된 댓글이 없습니다.</p>';
                    return;
                }
                snap.forEach(cDoc => {
                    const c = cDoc.data();
                    const cTime = c.createdAt ? new Date(c.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';
                    const initial = c.author ? c.author.charAt(0).toUpperCase() : '?';

                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `
                        <div class="comment-avatar">${initial}</div>
                        <div class="comment-body">
                            <div class="comment-meta">
                                ${escapeHtml(c.author)}
                                <span class="comment-time">${cTime}</span>
                            </div>
                            <div style="white-space: pre-wrap; font-size:0.95rem;">${escapeHtml(c.text)}</div>
                            ${c.imageUrl ? `<img src="${c.imageUrl}" style="max-width:150px; border-radius:4px; margin-top:0.4rem; display:block;">` : ''}
                        </div>
                    `;
                    commentsListEl.appendChild(div);
                });
            });
        }

        // 댓글 등록
        document.getElementById('btn-submit-comment').addEventListener('click', async () => {
            if (!currentPostId) return;
            const textInput = document.getElementById('comment-text-input');
            const fileInput = document.getElementById('comment-file-input');
            const text = textInput.value.trim();

            if (!text && (!fileInput.files || !fileInput.files[0])) return alert('댓글 내용을 입력하거나 이미지를 첨부해주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : userIp;

            try {
                await addDoc(collection(db, "posts", currentPostId, "comments"), {
                    text,
                    imageUrl,
                    author: authorName,
                    createdAt: serverTimestamp()
                });
                textInput.value = '';
                fileInput.value = '';
            } catch (e) {
                alert('댓글 작성 실패: ' + e.message);
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
