<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="google-site-verification" content="6wmgBtvoq2IRZiGoY9FspMBgcY7WtydQTK6HYss2iPE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알로아로아</title>
    <style>
        :root {
            --header-bg: #80effe; /* 상단 민트색/하늘색 */
            --header-text: #000000;
            --border-color: #000000;
            --border-width: 3px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. 가장 상단 민트색 헤더 */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 1.5rem;
            border-bottom: var(--border-width) solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .header-left, .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 2;
        }

        .btn-header {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 0.4rem 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-header:hover {
            background-color: #f0f0f0;
        }

        /* 2. 본문 메인 레이아웃 (좌: 메인글, 우: 실시간/추천글) */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* 공통 박스 테두리 */
        .bordered-box {
            border: var(--border-width) solid var(--border-color);
            background: #ffffff;
        }

        /* ---------------- 좌측 영역 ---------------- */
        .left-content {
            display: flex;
            flex-direction: column;
        }

        /* 게시글 테이블 헤더 */
        .post-table-header {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            padding: 0.8rem 1rem;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: var(--border-width) solid var(--border-color);
            background-color: #fdfdfd;
            text-align: center;
        }

        .post-table-header div:first-child {
            text-align: center;
        }

        /* 게시글 리스트 스크롤 영역 */
        .post-list-scroll {
            height: 680px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        /* 커스텀 스크롤바 디자인 */
        .post-list-scroll::-webkit-scrollbar {
            width: 14px;
        }
        .post-list-scroll::-webkit-scrollbar-track {
            background: #ffffff;
            border-left: 2px solid #000000;
        }
        .post-list-scroll::-webkit-scrollbar-thumb {
            background: #ffffff;
            border: 2px solid #000000;
        }

        /* 게시글 줄 아이템 */
        .post-row {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            align-items: center;
        }

        .post-row:hover {
            background-color: #f5f5f5;
        }

        .post-row-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-row-author, .post-row-date {
            text-align: center;
            font-size: 0.95rem;
            color: #333;
        }

        /* ---------------- 우측 영역 ---------------- */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .side-card {
            padding: 1rem;
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }

        .side-card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--border-color);
        }

        .side-list-item {
            padding: 0.5rem 0;
            border-bottom: 1px dashed #bbb;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .side-list-item:hover {
            font-weight: bold;
        }

        /* 카운터 미니 카드 */
        .stats-banner {
            display: flex;
            justify-content: space-around;
            padding: 0.8rem;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stats-banner span {
            color: #e60000;
        }

        /* ---------------- 상세 페이지 & 댓글 ---------------- */
        #detail-view {
            display: none;
            padding: 1.5rem;
        }

        .comments-section {
            margin-top: 2rem;
            border-top: 2px solid #000;
            padding-top: 1rem;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 0.8rem;
            border-bottom: 1px solid #eee;
            align-items: flex-start;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* 폼 요소 */
        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 0.6rem;
            margin: 0.4rem 0 0.8rem 0;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #333333;
        }

        .btn-secondary {
            background-color: #777777;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: var(--border-width) solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        footer {
            border-top: var(--border-width) solid var(--border-color);
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            margin-top: auto;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 민트색 헤더 -->
    <header>
        <div class="header-left">
            <button class="btn-header" id="btn-open-write">글 작성</button>
        </div>
        
        <div class="header-title" onclick="goHome()">알로아로아</div>
        
        <div class="header-right" id="auth-nav-area">
            <button class="btn-header" id="btn-open-auth">로그인 / 회원가입</button>
        </div>
    </header>

    <!-- 2. 본문 레이아웃 -->
    <div class="main-container">
        
        <!-- 좌측 메인 영역 (글 목록 또는 상세 페이지) -->
        <main class="left-content">
            
            <!-- 피드 뷰 (목록) -->
            <div id="feed-view" class="bordered-box">

                <!-- 스크롤 게시글 창 -->
                <div class="post-list-scroll" id="posts-list">
                    <p style="text-align:center; padding: 2rem;">게시글을 불러오는 중입니다...</p>
                </div>
            </div>

            <!-- 상세 페이지 뷰 -->
            <div id="detail-view" class="bordered-box">
                <button class="btn btn-secondary" onclick="goHome()" style="margin-bottom: 1rem;">← 목록으로 돌아가기</button>
                <div id="detail-content-area"></div>
                
                <div class="comments-section">
                    <h3>댓글</h3>
                    <div id="detail-comments-list" style="margin-top: 1rem;">댓글을 불러오는 중...</div>
                    
                    <div id="comment-write-area" style="margin-top: 1.5rem;">
                        <textarea id="comment-text-input" rows="2" placeholder="댓글 내용을 입력하세요..."></textarea>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem;">
                            <input type="file" id="comment-file-input" accept="image/*" style="width: auto; margin:0;">
                            <button class="btn" id="btn-submit-comment">댓글 등록</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- 우측 사이드바 영역 -->
        <aside class="right-sidebar">
            
            <!-- 상단 접속자 / 가입자 요약 정보 -->
            <div class="bordered-box stats-banner">
                <div>가입자 <span id="total-users-count">0</span>명</div>
                <div>|</div>
                <div>실시간 접속 <span id="online-users-count">1</span>명</div>
            </div>

            <!-- 실시간 글들 -->
            <div class="bordered-box side-card" style="flex: 1;">
                <div class="side-card-title">실시간 글들</div>
                <div id="recent-posts-side">
                    <div class="side-list-item">불러오는 중...</div>
                </div>
            </div>

            <!-- 추천이 가장 많은 글들 -->
            <div class="bordered-box side-card" style="flex: 1.2;">
                <div class="side-card-title">추천이 가장 많은 글들</div>
                <div id="top-posts-side">
                    <div class="side-list-item">추천글 데이터를 계산 중입니다.</div>
                </div>
            </div>

        </aside>

    </div>

    <!-- 글 작성 모달 -->
    <div class="modal" id="write-modal">
        <div class="modal-content">
            <h2>새로운 소식 작성</h2>
            <input type="text" id="post-title-input" placeholder="제목을 입력하세요">
            <textarea id="post-content-input" rows="6" placeholder="내용을 입력하세요..."></textarea>
            <label style="font-size: 0.9rem; font-weight: bold; display: block;">이미지 / GIF 첨부:</label>
            <input type="file" id="post-file-input" accept="image/*">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-submit-post" style="flex:1;">게시하기</button>
                <button class="btn btn-secondary" id="btn-close-write" style="flex:1;">취소</button>
            </div>
        </div>
    </div>

    <!-- 로그인/가입 모달 -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2>로그인 / 회원가입</h2>
            <input type="email" id="auth-email" placeholder="이메일 주소">
            <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
            <input type="text" id="auth-nickname" placeholder="닉네임 (가입시에만 필요)">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-login" style="flex:1;">로그인</button>
                <button class="btn btn-secondary" id="btn-signup" style="flex:1;">회원가입</button>
            </div>
            <button id="btn-close-auth" style="margin-top: 1rem; width:100%; background:none; border:none; color:#666; cursor:pointer;">닫기</button>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        알로아로아
    </footer>

    <!-- Firebase 및 앱 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, limit,
            onSnapshot, serverTimestamp, doc, setDoc, getDoc, getCountFromServer
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCfC8wc2viAAKBXK5PHM9-jYYV6OfxI9o",
            authDomain: "korean-empire.firebaseapp.com",
            projectId: "korean-empire",
            storageBucket: "korean-empire.firebasestorage.app",
            messagingSenderId: "1059886832097",
            appId: "1:1059886832097:web:e5622134c671799db05aa0",
            measurementId: "G-2VXJ274Q5Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentPostId = null;
        let userIp = "IP: 127.0.0.1";

        // 세션 식별자 생성
        let sessionId = localStorage.getItem('site_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
            localStorage.setItem('site_session_id', sessionId);
        }

        // 공인 IP 조회
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { userIp = `IP: ${data.ip}`; })
            .catch(() => { userIp = "IP: 192.168.x.x"; });

        // DOM 요소
        const authModal = document.getElementById('auth-modal');
        const writeModal = document.getElementById('write-modal');
        const btnOpenAuth = document.getElementById('btn-open-auth');
        const btnCloseAuth = document.getElementById('btn-close-auth');
        const btnOpenWrite = document.getElementById('btn-open-write');
        const btnCloseWrite = document.getElementById('btn-close-write');
        const authNavArea = document.getElementById('auth-nav-area');
        const feedView = document.getElementById('feed-view');
        const detailView = document.getElementById('detail-view');
        const postsList = document.getElementById('posts-list');
        const recentPostsSide = document.getElementById('recent-posts-side');
        const topPostsSide = document.getElementById('top-posts-side');
        const totalUsersEl = document.getElementById('total-users-count');
        const onlineUsersEl = document.getElementById('online-users-count');

        // 모달 제어
        btnOpenAuth.addEventListener('click', () => authModal.style.display = 'flex');
        btnCloseAuth.addEventListener('click', () => authModal.style.display = 'none');
        btnOpenWrite.addEventListener('click', () => writeModal.style.display = 'flex');
        btnCloseWrite.addEventListener('click', () => writeModal.style.display = 'none');

        window.goHome = () => {
            detailView.style.display = 'none';
            feedView.style.display = 'block';
            currentPostId = null;
            window.scrollTo(0, 0);
        };

        // 🌐 접속 신호 (Heartbeat)
        async function updateHeartbeat() {
            try {
                await setDoc(doc(db, "active_sessions", sessionId), {
                    lastSeen: serverTimestamp()
                });
            } catch (e) { console.log(e); }
        }

        updateHeartbeat();
        setInterval(updateHeartbeat, 10000);

        // 실시간 접속자 수 감지
        onSnapshot(collection(db, "active_sessions"), (snapshot) => {
            const now = Date.now();
            let activeCount = 0;
            snapshot.forEach((sessionDoc) => {
                const data = sessionDoc.data();
                if (data.lastSeen) {
                    const lastSeenTime = data.lastSeen.toDate().getTime();
                    if (now - lastSeenTime < 30000) {
                        activeCount++;
                    }
                }
            });
            onlineUsersEl.textContent = Math.max(1, activeCount);
        });

        // 인증 상태 감지
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authModal.style.display = 'none';
                authNavArea.innerHTML = `
                    <span style="font-weight:bold; margin-right:5px;">${user.displayName || user.email.split('@')[0]}님</span>
                    <button class="btn-header" id="btn-logout">로그아웃</button>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            } else {
                authNavArea.innerHTML = `<button class="btn-header" id="btn-open-auth">로그인 / 회원가입</button>`;
                document.getElementById('btn-open-auth').addEventListener('click', () => authModal.style.display = 'flex');
            }
            updateTotalUsersCount();
        });

        // 회원가입
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value || email.split('@')[0];

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: nickname });
                await setDoc(doc(db, "users", cred.user.uid), { email, nickname });
                alert('가입이 완료되었습니다!');
            } catch (err) {
                alert('가입 오류: ' + err.message);
            }
        });

        // 로그인
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인되었습니다.');
            } catch (err) {
                alert('로그인 오류: ' + err.message);
            }
        });

        // 실시간 가입자 수
        async function updateTotalUsersCount() {
            try {
                const snapshot = await getCountFromServer(collection(db, "users"));
                totalUsersEl.textContent = snapshot.data().count;
            } catch (e) { console.log(e); }
        }

        // 이미지 파일 Base64 변환
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 날짜를 "월.일. 시:분" 형태로 포맷팅
        function formatDateShort(timestamp) {
            if (!timestamp) return '방금 전';
            const date = timestamp.toDate();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${month}.${day}. ${hours}:${minutes}`;
        }

        // 글 작성
        document.getElementById('btn-submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();
            const fileInput = document.getElementById('post-file-input');

            if (!title || !content) return alert('제목과 내용을 작성해 주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : userIp;

            try {
                await addDoc(collection(db, "posts"), {
                    title,
                    content,
                    imageUrl,
                    author: authorName,
                    likes: 0,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-title-input').value = '';
                document.getElementById('post-content-input').value = '';
                fileInput.value = '';
                writeModal.style.display = 'none';
            } catch (e) {
                alert('게시 오류: ' + e.message);
            }
        });

        // 실시간 게시글 목록 (메인 스크롤 창 & 우측 사이드바 연동)
        const qPosts = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(qPosts, (snapshot) => {
            postsList.innerHTML = '';
            recentPostsSide.innerHTML = '';
            topPostsSide.innerHTML = '';

            if (snapshot.empty) {
                postsList.innerHTML = '<p style="text-align:center; padding: 2rem; color:#777;">작성된 글이 없습니다.</p>';
                recentPostsSide.innerHTML = '<div class="side-list-item">글이 없습니다.</div>';
                topPostsSide.innerHTML = '<div class="side-list-item">글이 없습니다.</div>';
                return;
            }

            let count = 0;
            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                const formattedTime = formatDateShort(post.createdAt);

                // 1. 메인 가로 줄 항목
                const rowEl = document.createElement('div');
                rowEl.className = 'post-row';
                rowEl.onclick = () => openDetail(postId);
                rowEl.innerHTML = `
                    <div class="post-row-title">${escapeHtml(post.title)}</div>
                    <div class="post-row-author">${escapeHtml(post.author)}</div>
                    <div class="post-row-date">${formattedTime}</div>
                `;
                postsList.appendChild(rowEl);

                // 2. 우측 [실시간 글들] (최대 5개)
                if (count < 5) {
                    const sideEl = document.createElement('div');
                    sideEl.className = 'side-list-item';
                    sideEl.onclick = () => openDetail(postId);
                    sideEl.textContent = `• ${post.title}`;
                    recentPostsSide.appendChild(sideEl);
                }

                // 3. 우측 [추천이 가장 많은 글들]
                if (count < 5) {
                    const topEl = document.createElement('div');
                    topEl.className = 'side-list-item';
                    topEl.onclick = () => openDetail(postId);
                    topEl.textContent = `★ ${post.title}`;
                    topPostsSide.appendChild(topEl);
                }

                count++;
            });
        });

        // 상세 페이지 열기
        window.openDetail = async (postId) => {
            currentPostId = postId;
            feedView.style.display = 'none';
            detailView.style.display = 'block';

            const docRef = doc(db, "posts", postId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const post = docSnap.data();
                const formattedTime = formatDateShort(post.createdAt);
                
                document.getElementById('detail-content-area').innerHTML = `
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${escapeHtml(post.title)}</h2>
                    <div style="font-size:0.9rem; color:#666; margin-bottom: 1rem; border-bottom:1px solid #ddd; padding-bottom:0.5rem;">
                        작성자: <strong>${escapeHtml(post.author)}</strong> | 작성일시: ${formattedTime}
                    </div>
                    <div style="white-space: pre-wrap; margin: 1rem 0; font-size: 1.05rem; line-height: 1.6;">${escapeHtml(post.content)}</div>
                    ${post.imageUrl ? `<img src="${post.imageUrl}" style="max-width:100%; border:2px solid #000; border-radius:4px; margin-top:1rem;">` : ''}
                `;
                loadComments(postId);
            } else {
                alert('존재하지 않는 게시글입니다.');
                goHome();
            }
            window.scrollTo(0, 0);
        };

        // 실시간 댓글
        function loadComments(postId) {
            const commentsListEl = document.getElementById('detail-comments-list');
            const qComments = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
            
            onSnapshot(qComments, (snap) => {
                commentsListEl.innerHTML = '';
                if(snap.empty) {
                    commentsListEl.innerHTML = '<p style="color:#888; font-size:0.9rem;">작성된 댓글이 없습니다.</p>';
                    return;
                }
                snap.forEach(cDoc => {
                    const c = cDoc.data();
                    const formattedTime = formatDateShort(c.createdAt);
                    const initial = c.author ? c.author.charAt(0).toUpperCase() : '?';

                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `
                        <div class="comment-avatar">${initial}</div>
                        <div style="flex:1;">
                            <div style="font-size:0.85rem; font-weight:bold; margin-bottom:0.2rem;">
                                ${escapeHtml(c.author)} <span style="font-weight:normal; color:#888; font-size:0.75rem;">${formattedTime}</span>
                            </div>
                            <div style="white-space: pre-wrap; font-size:0.95rem;">${escapeHtml(c.text)}</div>
                            ${c.imageUrl ? `<img src="${c.imageUrl}" style="max-width:150px; border:1px solid #000; border-radius:4px; margin-top:0.4rem; display:block;">` : ''}
                        </div>
                    `;
                    commentsListEl.appendChild(div);
                });
            });
        }

        // 댓글 등록
        document.getElementById('btn-submit-comment').addEventListener('click', async () => {
            if (!currentPostId) return;
            const textInput = document.getElementById('comment-text-input');
            const fileInput = document.getElementById('comment-file-input');
            const text = textInput.value.trim();

            if (!text && (!fileInput.files || !fileInput.files[0])) return alert('댓글 내용을 입력하거나 이미지를 첨부해주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : userIp;

            try {
                await addDoc(collection(db, "posts", currentPostId, "comments"), {
                    text,
                    imageUrl,
                    author: authorName,
                    createdAt: serverTimestamp()
                });
                textInput.value = '';
                fileInput.value = '';
            } catch (e) {
                alert('댓글 작성 실패: ' + e.message);
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
