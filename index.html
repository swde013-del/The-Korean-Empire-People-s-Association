<!DOCTYPE html>
<html lang="ko">
<head>
        <meta name="google-site-verification" content="6wmgBtvoq2IRZiGoY9FspMBgcY7WtydQTK6HYss2iPE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한제국인민협회</title>
    <style>
        :root {
            --header-bg: #e60000;
            --header-text: #ffffff;
            --bg-color: #f8f9fa;
            --border-color: #000000;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. 상단 헤더 */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
            border-radius: 3px;
       }

        .auth-nav-btn {
            background-color: transparent;
            color: white;
            border: 2px solid white;
            padding: 0.4rem 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .auth-nav-btn:hover {
            background-color: rgba(255,255,255,0.2);
        }

        /* 2. 메인 비주얼 영역 */
        .hero-section {
            background-color: #ffffff;
            border-bottom: 2px solid var(--border-color);
            padding: 2.5rem 1rem;
            text-align: center;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero-image-box {
            width: 100%;
            max-width: 700px;
            height: 180px;
            margin: 0 auto;
            border: 2px dashed #888;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #555;
            border-radius: 6px;
        }

        .hero-image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 3. 본문 레이아웃 */
        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* 카운터 & 패치 카드 */
        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-value {
            font-size: 1.4rem;
            color: var(--header-bg);
            margin-top: 0.3rem;
        }

        .patch-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            min-height: 200px;
        }

        .patch-card h3 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        /* 게시글 영역 */
        .posts-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .posts-card h2 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        /* 폼 요소 */
        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 0.6rem;
            margin: 0.4rem 0 0.8rem 0;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--header-bg);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #cc0000;
        }

        .btn-secondary {
            background-color: #555;
        }

        /* 게시글 & 댓글 스타일 */
        .post-item {
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }

        .post-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .post-meta {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.4rem;
        }

        .comments-box {
            background-color: #f1f3f5;
            padding: 0.8rem;
            border-radius: 6px;
            margin-top: 0.8rem;
        }

        .comment-item {
            font-size: 0.85rem;
            padding: 0.2rem 0;
            border-bottom: 1px dashed #ccc;
        }

        /* 모달 (로그인/가입) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            border: 2px solid var(--border-color);
        }

        /* 푸터 */
        footer {
            border-top: 2px solid var(--border-color);
            background: #ffffff;
            padding: 1rem;
            margin-top: auto;
        }

        .footer-top {
            display: flex;
            justify-content: flex-end;
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 0.5rem;
        }

        .contact-link {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-bottom {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding-top: 0.5rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
        <script type="module">

  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCCfC8wc2viAAKBXK5PHM9-jYYV6OfxI9o",
    authDomain: "korean-empire.firebaseapp.com",
    projectId: "korean-empire",
    storageBucket: "korean-empire.firebasestorage.app",
    messagingSenderId: "1059886832097",
    appId: "1:1059886832097:web:3f06c1e47af9a3edb05aa0",
    measurementId: "G-2VXJ274Q5Q"
  };
    </div>
</header>

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

    <!-- 1. 상단 네비게이션 (로고 & 회원가입/로그인) -->
 <header>
    <div class="logo-container">
        <img src="logo.png" alt="대한제국 태극기 로고" class="logo-img">
        <span>대한제국인민협회</span>
    </div>
    <div id="auth-nav-area">
        <button class="auth-nav-btn" id="btn-open-auth">회원가입과 로그인</button>
    </div>
</header>

    <!-- 2. 메인 비주얼 (영문 타이틀 & 이미지) -->
    <section class="hero-section">
        <h1 class="hero-title">The Korean Empire People's Association</h1>
        <div class="hero-image-box">
            <span>이미지</span>
        </div>
    </section>

    <!-- 3. 본문 레이아웃 -->
    <div class="main-container">
        <!-- 좌측 대시보드 -->
        <aside class="left-aside">
            <div class="stat-card">
                <div>현재 실시간 가입자수</div>
                <div class="stat-value" id="total-users-count">0 명</div>
            </div>

            <div class="stat-card">
                <div>현재 실시간 접속자 수</div>
                <div class="stat-value" id="online-users-count">1 명</div>
            </div>

            <div class="patch-card">
                <h3>패치 내용</h3>
                <ul style="padding-left: 1.2rem; font-size: 0.9rem; line-height: 1.8;">
                    <li>v1.0.0 정식 오픈</li>
                    <li>실시간 접속자 및 가입자 집계 추가</li>
                    <li>소식 작성 및 댓글 기능 연동</li>
                </ul>
            </div>
        </aside>

        <!-- 우측 작성한 글들 -->
        <main class="posts-card">
            <h2>작성한 글들</h2>

            <!-- 소식 작성 폼 (로그인 시 표출) -->
            <div id="post-create-area" style="margin-bottom: 1.5rem; display: none;">
                <input type="text" id="post-title-input" placeholder="제목을 입력하세요">
                <textarea id="post-content-input" rows="3" placeholder="내용을 입력하세요"></textarea>
                <button class="btn" id="btn-submit-post">글 작성하기</button>
            </div>
            <div id="login-notice" style="margin-bottom: 1rem; color: #666; font-size: 0.9rem;">
                * 글을 작성하시려면 우측 상단에서 로그인해 주세요.
            </div>

            <!-- 실시간 게시글 목록 -->
            <div id="posts-list">
                <p>게시글을 불러오는 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- 4. 인증 모달 (회원가입 / 로그인) -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1rem;">로그인 / 회원가입</h2>
            <input type="email" id="auth-email" placeholder="이메일 주소">
            <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
            <input type="text" id="auth-nickname" placeholder="닉네임 (가입시에만 필요)">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-login" style="flex:1;">로그인</button>
                <button class="btn btn-secondary" id="btn-signup" style="flex:1;">회원가입</button>
            </div>
            <button id="btn-close-modal" style="margin-top: 1rem; width:100%; background:none; border:none; color:#666; cursor:pointer;">닫기</button>
        </div>
    </div>

    <!-- 5. 하단 푸터 및 문의 -->
    <footer>
        <div class="footer-top">
            <a href="mailto:swde013@gmail.com" class="contact-link">문의</a>
        </div>
        <div class="footer-bottom">
            대한제국인민협회
        </div>
    </footer>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, 
            onSnapshot, serverTimestamp, doc, setDoc, getCountFromServer 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 본인의 Firebase 설정값으로 교체하세요
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Elements
        const authModal = document.getElementById('auth-modal');
        const btnOpenAuth = document.getElementById('btn-open-auth');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const authNavArea = document.getElementById('auth-nav-area');
        const postCreateArea = document.getElementById('post-create-area');
        const loginNotice = document.getElementById('login-notice');
        const postsList = document.getElementById('posts-list');
        const totalUsersEl = document.getElementById('total-users-count');

        // Modal Open/Close
        btnOpenAuth.addEventListener('click', () => authModal.style.display = 'flex');
        btnCloseModal.addEventListener('click', () => authModal.style.display = 'none');

        // Auth State Listener
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authModal.style.display = 'none';
                authNavArea.innerHTML = `
                    <span style="margin-right:10px;">${user.displayName || user.email.split('@')[0]}님</span>
                    <button class="auth-nav-btn" id="btn-logout">로그아웃</button>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
                postCreateArea.style.display = 'block';
                loginNotice.style.display = 'none';
            } else {
                authNavArea.innerHTML = `<button class="auth-nav-btn" id="btn-open-auth">회원가입과 로그인</button>`;
                document.getElementById('btn-open-auth').addEventListener('click', () => authModal.style.display = 'flex');
                postCreateArea.style.display = 'none';
                loginNotice.style.display = 'block';
            }
            updateTotalUsersCount();
        });

        // Signup
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value || email.split('@')[0];

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: nickname });
                // Save to users collection for counting
                await setDoc(doc(db, "users", cred.user.uid), { email, nickname });
                alert('가입이 완료되었습니다!');
            } catch (err) {
                alert('가입 오류: ' + err.message);
            }
        });

        // Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인되었습니다.');
            } catch (err) {
                alert('로그인 오류: ' + err.message);
            }
        });

        // Total Users Count
        async function updateTotalUsersCount() {
            try {
                const coll = collection(db, "users");
                const snapshot = await getCountFromServer(coll);
                totalUsersEl.textContent = `${snapshot.data().count} 명`;
            } catch (e) {
                console.log(e);
            }
        }

        // Create Post
        document.getElementById('btn-submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();

            if (!title || !content) return alert('제목과 내용을 작성해 주세요.');

            try {
                await addDoc(collection(db, "posts"), {
                    title,
                    content,
                    author: currentUser.displayName || currentUser.email,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-title-input').value = '';
                document.getElementById('post-content-input').value = '';
            } catch (e) {
                alert('게시 오류: ' + e.message);
            }
        });

        // Realtime Posts Fetch
        const qPosts = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(qPosts, (snapshot) => {
            postsList.innerHTML = '';
            if (snapshot.empty) {
                postsList.innerHTML = '<p style="color:#777;">작성된 글이 없습니다.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                const time = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';

                const postEl = document.createElement('div');
                postEl.className = 'post-item';
                postEl.innerHTML = `
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-meta">작성자: ${escapeHtml(post.author)} | ${time}</div>
                    <div style="white-space: pre-wrap; margin-bottom:0.5rem;">${escapeHtml(post.content)}</div>
                    <div class="comments-box">
                        <div id="comments-list-${postId}">댓글 불러오는 중...</div>
                        ${currentUser ? `
                            <div style="display:flex; gap:0.4rem; margin-top:0.5rem;">
                                <input type="text" id="comment-input-${postId}" placeholder="댓글 작성..." style="margin:0;">
                                <button class="btn" onclick="window.addComment('${postId}')" style="padding:0.3rem 0.6rem; font-size:0.8rem;">등록</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                postsList.appendChild(postEl);
                loadComments(postId);
            });
        });

        // Realtime Comments
        function loadComments(postId) {
            const cList = document.getElementById(`comments-list-${postId}`);
            const qComments = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
            onSnapshot(qComments, (snap) => {
                cList.innerHTML = '';
                if(snap.empty) {
                    cList.innerHTML = '<span style="font-size:0.8rem; color:#888;">댓글이 없습니다.</span>';
                    return;
                }
                snap.forEach(cDoc => {
                    const c = cDoc.data();
                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `<strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}`;
                    cList.appendChild(div);
                });
            });
        }

        window.addComment = async (postId) => {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if(!text) return;

            try {
                await addDoc(collection(db, "posts", postId, "comments"), {
                    text,
                    author: currentUser.displayName || currentUser.email,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (e) {
                alert('댓글 작성 실패: ' + e.message);
            }
        };

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
