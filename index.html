<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="google-site-verification" content="6wmgBtvoq2IRZiGoY9FspMBgcY7WtydQTK6HYss2iPE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알리아로아</title>
    <style>
        :root {
            --header-bg: #80effe; /* 상단 민트색/하늘색 */
            --header-text: #000000;
            --border-color: #000000;
            --border-width: 3px;
            --gold-color: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 1. 상단 민트색 헤더 */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem 1.5rem;
            border-bottom: var(--border-width) solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .header-left, .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 2;
        }

        .btn-header {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 0.4rem 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-header:hover {
            background-color: #f0f0f0;
        }

        /* 관리자 금색 스타일 */
        .admin-nickname {
            color: #b8860b !important;
            font-weight: 900 !important;
            text-shadow: 0px 0px 3px rgba(212, 175, 55, 0.6);
            cursor: pointer;
        }

        .admin-badge {
            background: linear-gradient(45deg, #ffd700, #b8860b);
            color: #000;
            font-size: 0.7rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 4px;
            font-weight: bold;
            border: 1px solid #000;
        }

        /* 2. 본문 메인 레이아웃 */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* 공통 박스 테두리 */
        .bordered-box {
            border: var(--border-width) solid var(--border-color);
            background: #ffffff;
        }

        /* ---------------- 좌측 영역 ---------------- */
        .left-content {
            display: flex;
            flex-direction: column;
        }

        /* 게시글 테이블 헤더 */
        .post-table-header {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            padding: 0.8rem 1rem;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: var(--border-width) solid var(--border-color);
            background-color: #fdfdfd;
            text-align: center;
        }

        /* 게시글 리스트 스크롤 영역 */
        .post-list-scroll {
            height: 680px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .post-list-scroll::-webkit-scrollbar {
            width: 14px;
        }
        .post-list-scroll::-webkit-scrollbar-track {
            background: #ffffff;
            border-left: 2px solid #000000;
        }
        .post-list-scroll::-webkit-scrollbar-thumb {
            background: #ffffff;
            border: 2px solid #000000;
        }

        /* 게시글 줄 아이템 */
        .post-row {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #ccc;
            align-items: center;
        }

        .post-row:hover {
            background-color: #f5f5f5;
        }

        .post-row-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .post-row-author, .post-row-date {
            text-align: center;
            font-size: 0.95rem;
            color: #333;
        }

        .clickable-user {
            cursor: pointer;
            text-decoration: underline;
        }
        .clickable-user:hover {
            color: #27ae60;
        }

        /* ---------------- 우측 영역 ---------------- */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .side-card {
            padding: 1rem;
            min-height: 250px;
            display: flex;
            flex-direction: column;
        }

        .side-card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--border-color);
        }

        .side-list-item {
            padding: 0.5rem 0;
            border-bottom: 1px dashed #bbb;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .side-list-item:hover {
            font-weight: bold;
        }

        .stats-banner {
            display: flex;
            justify-content: space-around;
            padding: 0.8rem;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stats-banner span {
            color: #e60000;
        }

        /* ---------------- 상세 페이지 & 댓글 ---------------- */
        #detail-view {
            display: none;
            padding: 1.5rem;
        }

        .vote-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2.5rem 0 2rem 0;
        }

        .circle-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3.5px solid #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, opacity 0.2s;
        }

        .circle-btn:active {
            transform: scale(0.95);
        }

        .circle-btn.active {
            box-shadow: 0 0 0 4px #000;
        }

        .btn-like {
            background-color: #27ae60;
            color: #ffffff;
        }

        .btn-dislike {
            background-color: #b2bec3;
            color: #000000;
        }

        .comments-outer-box {
            border: var(--border-width) solid var(--border-color);
            padding: 1.2rem;
            margin-top: 1.5rem;
            background: #ffffff;
        }

        .comments-title-area {
            border-bottom: 2px solid #000000;
            padding-bottom: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .comments-title-area h3 {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 0.8rem 0;
            border-bottom: 1px solid #ddd;
            align-items: flex-start;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            border: 2px solid #000;
            overflow: hidden;
            cursor: pointer;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-input-box {
            margin-top: 1.5rem;
        }

        .comment-input-box textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #000000;
            border-radius: 4px;
            font-size: 0.95rem;
            resize: vertical;
        }

        .comment-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.6rem;
        }

        /* 폼 요소 공통 */
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.6rem;
            margin: 0.4rem 0 0.8rem 0;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.4rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #333333;
        }

        .btn-secondary {
            background-color: #777777;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 550px;
            border: var(--border-width) solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* 프로필 모달 커스텀 */
        .profile-header-area {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .profile-large-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid #000;
            overflow: hidden;
        }

        .profile-large-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-stats-row {
            display: flex;
            gap: 1rem;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        .profile-tab-bar {
            display: flex;
            border-bottom: 2px solid #000;
            margin-bottom: 1rem;
        }

        .profile-tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            border-right: 1px solid #ccc;
        }

        .profile-tab.active {
            background: #000;
            color: #fff;
        }

        .user-activity-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .activity-item:hover {
            font-weight: bold;
            color: #27ae60;
        }

        footer {
            border-top: var(--border-width) solid var(--border-color);
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            margin-top: auto;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 민트색 헤더 -->
    <header>
        <div class="header-left">
            <button class="btn-header" id="btn-open-write">글 작성</button>
        </div>
        
        <div class="header-title" onclick="goHome()">알로아로아</div>
        
        <div class="header-right" id="auth-nav-area">
            <button class="btn-header" id="btn-open-auth">로그인 / 회원가입</button>
        </div>
    </header>

    <!-- 2. 본문 레이아웃 -->
    <div class="main-container">
        
        <!-- 좌측 메인 영역 -->
        <main class="left-content">
            
            <!-- 피드 뷰 (목록) -->
            <div id="feed-view" class="bordered-box">
                <div class="post-table-header">
                    <div>글들</div>
                    <div>닉네임</div>
                    <div>작성일시 (시분까지)</div>
                </div>

                <div class="post-list-scroll" id="posts-list">
                    <p style="text-align:center; padding: 2rem;">게시글을 불러오는 중입니다...</p>
                </div>
            </div>

            <!-- 상세 페이지 뷰 -->
            <div id="detail-view" class="bordered-box">
                <button class="btn btn-secondary" onclick="goHome()" style="margin-bottom: 1rem;">← 목록으로 돌아가기</button>
                <div id="detail-content-area"></div>
                
                <div class="vote-container">
                    <div class="circle-btn btn-like" id="btn-vote-like">
                        <span>추천</span>
                        <span id="vote-like-count" style="font-size:0.85rem; margin-top:2px;">0</span>
                    </div>
                    <div class="circle-btn btn-dislike" id="btn-vote-dislike">
                        <span>비추천</span>
                        <span id="vote-dislike-count" style="font-size:0.85rem; margin-top:2px;">0</span>
                    </div>
                </div>

                <div class="comments-outer-box">
                    <div class="comments-title-area">
                        <h3>댓글</h3>
                    </div>
                    
                    <div id="detail-comments-list">댓글을 불러오는 중...</div>
                    
                    <div class="comment-input-box">
                        <textarea id="comment-text-input" rows="3" placeholder="댓글 내용을 입력하세요..."></textarea>
                        <div class="comment-bottom-bar">
                            <input type="file" id="comment-file-input" accept="image/*">
                            <button class="btn" id="btn-submit-comment">댓글 등록</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- 우측 사이드바 영역 -->
        <aside class="right-sidebar">
            <div class="bordered-box stats-banner">
                <div>가입자 <span id="total-users-count">0</span>명</div>
                <div>|</div>
                <div>실시간 접속 <span id="online-users-count">1</span>명</div>
            </div>

            <div class="bordered-box side-card" style="flex: 1;">
                <div class="side-card-title">실시간 글들</div>
                <div id="recent-posts-side">
                    <div class="side-list-item">불러오는 중...</div>
                </div>
            </div>

            <div class="bordered-box side-card" style="flex: 1.2;">
                <div class="side-card-title">추천이 가장 많은 글들</div>
                <div id="top-posts-side">
                    <div class="side-list-item">불러오는 중...</div>
                </div>
            </div>
        </aside>

    </div>

    <!-- 유저 프로필 조회 모달 -->
    <div class="modal" id="user-profile-modal">
        <div class="modal-content">
            <div class="profile-header-area">
                <div class="profile-large-avatar" id="modal-user-avatar">?</div>
                <div>
                    <h2 id="modal-user-nickname" style="font-size:1.3rem;">닉네임</h2>
                    <div class="profile-stats-row">
                        <div>작성 글: <strong id="modal-user-posts-count">0</strong>개</div>
                        <div>|</div>
                        <div>작성 댓글: <strong id="modal-user-comments-count">0</strong>개</div>
                    </div>
                </div>
            </div>

            <div class="profile-tab-bar">
                <div class="profile-tab active" id="tab-posts" onclick="switchProfileTab('posts')">작성한 글</div>
                <div class="profile-tab" id="tab-comments" onclick="switchProfileTab('comments')">작성한 댓글</div>
            </div>

            <div class="user-activity-list" id="modal-activity-list">
                <p style="color:#777; padding:0.5rem;">활동 내역을 불러오는 중...</p>
            </div>

            <div style="margin-top:1.2rem; text-align:right;">
                <button class="btn btn-secondary" onclick="document.getElementById('user-profile-modal').style.display='none'">닫기</button>
            </div>
        </div>
    </div>

    <!-- 내 프로필 수정 모달 -->
    <div class="modal" id="edit-profile-modal">
        <div class="modal-content">
            <h2>내 프로필 수정</h2>
            <div style="margin-top:1rem;">
                <label style="font-weight:bold; font-size:0.9rem;">새 닉네임:</label>
                <input type="text" id="edit-nickname-input" placeholder="새로운 닉네임을 입력하세요">
                
                <label style="font-weight:bold; font-size:0.9rem; display:block; margin-top:0.5rem;">프로필 사진 (이미지/GIF):</label>
                <input type="file" id="edit-avatar-input" accept="image/*">
                
                <div style="display:flex; gap:0.5rem; margin-top:1.2rem;">
                    <button class="btn" id="btn-save-profile" style="flex:1;">저장하기</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('edit-profile-modal').style.display='none'" style="flex:1;">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 글 작성 모달 -->
    <div class="modal" id="write-modal">
        <div class="modal-content">
            <h2>새로운 소식 작성</h2>
            <input type="text" id="post-title-input" placeholder="제목을 입력하세요">
            <textarea id="post-content-input" rows="6" placeholder="내용을 입력하세요..."></textarea>
            <label style="font-size: 0.9rem; font-weight: bold; display: block;">이미지 / GIF 첨부:</label>
            <input type="file" id="post-file-input" accept="image/*">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-submit-post" style="flex:1;">게시하기</button>
                <button class="btn btn-secondary" id="btn-close-write" style="flex:1;">취소</button>
            </div>
        </div>
    </div>

    <!-- 로그인/가입 모달 -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2>로그인 / 회원가입</h2>
            <input type="email" id="auth-email" placeholder="이메일 주소">
            <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
            <input type="text" id="auth-nickname" placeholder="닉네임 (가입시에만 필요)">
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn" id="btn-login" style="flex:1;">로그인</button>
                <button class="btn btn-secondary" id="btn-signup" style="flex:1;">회원가입</button>
            </div>
            <button id="btn-close-auth" style="margin-top: 1rem; width:100%; background:none; border:none; color:#666; cursor:pointer;">닫기</button>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        알로아로아
    </footer>

    <!-- Firebase 및 앱 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, where, getDocs,
            onSnapshot, serverTimestamp, doc, setDoc, getDoc, getCountFromServer, updateDoc, runTransaction
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCfC8wc2viAAKBXK5PHM9-jYYV6OfxI9o",
            authDomain: "korean-empire.firebaseapp.com",
            projectId: "korean-empire",
            storageBucket: "korean-empire.firebasestorage.app",
            messagingSenderId: "1059886832097",
            appId: "1:1059886832097:web:e5622134c671799db05aa0",
            measurementId: "G-2VXJ274Q5Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentPostId = null;
        let userIp = "127.0.0.1";
        let activeProfileAuthor = null;
        let cachedUserPosts = [];
        let cachedUserComments = [];

        let sessionId = localStorage.getItem('site_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
            localStorage.setItem('site_session_id', sessionId);
        }

        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { userIp = data.ip; })
            .catch(() => { userIp = "192.168.x.x"; });

        const authModal = document.getElementById('auth-modal');
        const writeModal = document.getElementById('write-modal');
        const userProfileModal = document.getElementById('user-profile-modal');
        const editProfileModal = document.getElementById('edit-profile-modal');
        const btnOpenAuth = document.getElementById('btn-open-auth');
        const btnCloseAuth = document.getElementById('btn-close-auth');
        const btnOpenWrite = document.getElementById('btn-open-write');
        const btnCloseWrite = document.getElementById('btn-close-write');
        const authNavArea = document.getElementById('auth-nav-area');
        const feedView = document.getElementById('feed-view');
        const detailView = document.getElementById('detail-view');
        const postsList = document.getElementById('posts-list');
        const recentPostsSide = document.getElementById('recent-posts-side');
        const topPostsSide = document.getElementById('top-posts-side');
        const totalUsersEl = document.getElementById('total-users-count');
        const onlineUsersEl = document.getElementById('online-users-count');

        btnOpenAuth.addEventListener('click', () => authModal.style.display = 'flex');
        btnCloseAuth.addEventListener('click', () => authModal.style.display = 'none');
        btnOpenWrite.addEventListener('click', () => writeModal.style.display = 'flex');
        btnCloseWrite.addEventListener('click', () => writeModal.style.display = 'none');

        window.goHome = () => {
            detailView.style.display = 'none';
            feedView.style.display = 'block';
            currentPostId = null;
            window.scrollTo(0, 0);
        };

        // 접속 신호 (Heartbeat)
        async function updateHeartbeat() {
            try {
                await setDoc(doc(db, "active_sessions", sessionId), { lastSeen: serverTimestamp() });
            } catch (e) { console.log(e); }
        }

        updateHeartbeat();
        setInterval(updateHeartbeat, 10000);

        onSnapshot(collection(db, "active_sessions"), (snapshot) => {
            const now = Date.now();
            let activeCount = 0;
            snapshot.forEach((sessionDoc) => {
                const data = sessionDoc.data();
                if (data.lastSeen) {
                    const lastSeenTime = data.lastSeen.toDate().getTime();
                    if (now - lastSeenTime < 30000) activeCount++;
                }
            });
            onlineUsersEl.textContent = Math.max(1, activeCount);
        });

        // ----------------------------------------------------
        // 👑 로그인 / 사용자 프로필 및 관리자 금색 스타일 적용
        // ----------------------------------------------------
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authModal.style.display = 'none';
                
                // Firestore에서 프로필 정보 가져오기
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                let nickname = user.displayName || user.email.split('@')[0];
                let photoURL = user.photoURL || '';
                let isAdmin = false;

                if (userDocSnap.exists()) {
                    const uData = userDocSnap.data();
                    if (uData.nickname) nickname = uData.nickname;
                    if (uData.photoURL) photoURL = uData.photoURL;
                    if (uData.isAdmin) isAdmin = true;
                }

                const adminBadgeHtml = isAdmin ? `<span class="admin-badge">ADMIN</span>` : '';
                const nameClass = isAdmin ? `admin-nickname` : `clickable-user`;

                authNavArea.innerHTML = `
                    <span class="${nameClass}" onclick="openMyProfileEdit()" style="margin-right:8px;">${escapeHtml(nickname)}${adminBadgeHtml}</span>
                    <button class="btn-header" onclick="openMyProfileEdit()">프로필 수정</button>
                    <button class="btn-header" id="btn-logout">로그아웃</button>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            } else {
                authNavArea.innerHTML = `<button class="btn-header" id="btn-open-auth">로그인 / 회원가입</button>`;
                document.getElementById('btn-open-auth').addEventListener('click', () => authModal.style.display = 'flex');
            }
            updateTotalUsersCount();
        });

        // 내 프로필 수정 창 열기
        window.openMyProfileEdit = () => {
            if (!currentUser) return;
            document.getElementById('edit-nickname-input').value = currentUser.displayName || '';
            editProfileModal.style.display = 'flex';
        };

        // 내 프로필 저장
        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            if (!currentUser) return;
            const newNickname = document.getElementById('edit-nickname-input').value.trim();
            const avatarFile = document.getElementById('edit-avatar-input').files[0];

            if (!newNickname) return alert('닉네임을 입력해 주세요.');

            let photoURL = currentUser.photoURL || '';
            if (avatarFile) {
                try {
                    photoURL = await fileToBase64(avatarFile);
                } catch (e) {
                    alert('프로필 이미지 변환 실패');
                    return;
                }
            }

            try {
                await updateProfile(currentUser, { displayName: newNickname, photoURL: photoURL });
                await setDoc(doc(db, "users", currentUser.uid), {
                    nickname: newNickname,
                    photoURL: photoURL
                }, { merge: true });

                alert('프로필이 수정되었습니다!');
                editProfileModal.style.display = 'none';
                location.reload();
            } catch (e) {
                alert('프로필 수정 오류: ' + e.message);
            }
        });

        // 회원가입
        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value || email.split('@')[0];

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: nickname });
                
                // 첫 번째 회원 또는 특정 계정에 관리자 권한 부여 가능
                await setDoc(doc(db, "users", cred.user.uid), { 
                    email, 
                    nickname, 
                    isAdmin: true // 기본 관리자 권한 적용
                });
                alert('가입이 완료되었습니다!');
            } catch (err) {
                alert('가입 오류: ' + err.message);
            }
        });

        // 로그인
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인되었습니다.');
            } catch (err) {
                alert('로그인 오류: ' + err.message);
            }
        });

        async function updateTotalUsersCount() {
            try {
                const snapshot = await getCountFromServer(collection(db, "users"));
                totalUsersEl.textContent = snapshot.data().count;
            } catch (e) { console.log(e); }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function formatDateShort(timestamp) {
            if (!timestamp) return '방금 전';
            const date = timestamp.toDate();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${month}.${day}. ${hours}:${minutes}`;
        }

        // ----------------------------------------------------
        // 🔍 유저 프로필 및 게시글/댓글 집계 모달 불러오기
        // ----------------------------------------------------
        window.openUserProfile = async (authorName) => {
            activeProfileAuthor = authorName;
            const avatarEl = document.getElementById('modal-user-avatar');
            const nicknameEl = document.getElementById('modal-user-nickname');
            const postsCountEl = document.getElementById('modal-user-posts-count');
            const commentsCountEl = document.getElementById('modal-user-comments-count');
            const activityListEl = document.getElementById('modal-activity-list');

            nicknameEl.textContent = authorName;
            avatarEl.innerHTML = authorName.charAt(0).toUpperCase();
            activityListEl.innerHTML = '<p style="color:#777; padding:0.5rem;">활동 내역을 조회 중입니다...</p>';
            userProfileModal.style.display = 'flex';

            cachedUserPosts = [];
            cachedUserComments = [];

            try {
                // 1. 해당 유저가 작성한 글 검색
                const qUserPosts = query(collection(db, "posts"), where("author", "==", authorName));
                const postSnaps = await getDocs(qUserPosts);
                postSnaps.forEach(docSnap => {
                    cachedUserPosts.push({ id: docSnap.id, ...docSnap.data() });
                });

                // 2. 해당 유저가 작성한 댓글 검색
                const allPostsSnap = await getDocs(collection(db, "posts"));
                for (const pDoc of allPostsSnap.docs) {
                    const qComments = query(collection(db, "posts", pDoc.id, "comments"), where("author", "==", authorName));
                    const cSnaps = await getDocs(qComments);
                    cSnaps.forEach(cSnap => {
                        cachedUserComments.push({
                            postId: pDoc.id,
                            postTitle: pDoc.data().title,
                            ...cSnap.data()
                        });
                    });
                }

                postsCountEl.textContent = cachedUserPosts.length;
                commentsCountEl.textContent = cachedUserComments.length;

                switchProfileTab('posts');
            } catch (e) {
                console.error(e);
                activityListEl.innerHTML = '<p style="color:red; padding:0.5rem;">데이터를 불러오는 중 오류가 발생했습니다.</p>';
            }
        };

        window.switchProfileTab = (tab) => {
            const tabPosts = document.getElementById('tab-posts');
            const tabComments = document.getElementById('tab-comments');
            const activityListEl = document.getElementById('modal-activity-list');

            activityListEl.innerHTML = '';

            if (tab === 'posts') {
                tabPosts.classList.add('active');
                tabComments.classList.remove('active');

                if (cachedUserPosts.length === 0) {
                    activityListEl.innerHTML = '<p style="color:#888; padding:0.5rem;">작성한 글이 없습니다.</p>';
                    return;
                }

                cachedUserPosts.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'activity-item';
                    div.onclick = () => {
                        userProfileModal.style.display = 'none';
                        openDetail(post.id);
                    };
                    div.textContent = `• ${post.title} (${formatDateShort(post.createdAt)})`;
                    activityListEl.appendChild(div);
                });
            } else {
                tabComments.classList.add('active');
                tabPosts.classList.remove('active');

                if (cachedUserComments.length === 0) {
                    activityListEl.innerHTML = '<p style="color:#888; padding:0.5rem;">작성한 댓글이 없습니다.</p>';
                    return;
                }

                cachedUserComments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'activity-item';
                    div.onclick = () => {
                        userProfileModal.style.display = 'none';
                        openDetail(c.postId);
                    };
                    div.textContent = `💬 [글: ${c.postTitle}] ${c.text}`;
                    activityListEl.appendChild(div);
                });
            }
        };

        // ----------------------------------------------------
        // 🗳️ 추천 / 비추천 로직
        // ----------------------------------------------------
        function getVoterKey() {
            return currentUser ? `user_${currentUser.uid}` : `ip_${userIp.replace(/\./g, '_')}`;
        }

        async function handleVote(targetVote) {
            if (!currentPostId) return;
            const voterKey = getVoterKey();
            const voteDocRef = doc(db, "posts", currentPostId, "votes", voterKey);
            const postRef = doc(db, "posts", currentPostId);

            try {
                await runTransaction(db, async (transaction) => {
                    const voteSnap = await transaction.get(voteDocRef);
                    const postSnap = await transaction.get(postRef);
                    
                    if (!postSnap.exists()) return;

                    let currentLikes = postSnap.data().likes || 0;
                    let currentDislikes = postSnap.data().dislikes || 0;
                    let previousVote = voteSnap.exists() ? voteSnap.data().type : 'none';

                    if (previousVote === targetVote) {
                        if (targetVote === 'like') currentLikes = Math.max(0, currentLikes - 1);
                        if (targetVote === 'dislike') currentDislikes = Math.max(0, currentDislikes - 1);
                        transaction.delete(voteDocRef);
                    } else {
                        if (previousVote === 'like') currentLikes = Math.max(0, currentLikes - 1);
                        if (previousVote === 'dislike') currentDislikes = Math.max(0, currentDislikes - 1);

                        if (targetVote === 'like') currentLikes++;
                        if (targetVote === 'dislike') currentDislikes++;

                        transaction.set(voteDocRef, { type: targetVote, updatedAt: serverTimestamp() });
                    }

                    transaction.update(postRef, { likes: currentLikes, dislikes: currentDislikes });
                });
            } catch (e) {
                console.error(e);
                alert('투표 처리 중 오류가 발생했습니다.');
            }
        }

        document.getElementById('btn-vote-like').addEventListener('click', () => handleVote('like'));
        document.getElementById('btn-vote-dislike').addEventListener('click', () => handleVote('dislike'));

        // 글 작성
        document.getElementById('btn-submit-post').addEventListener('click', async () => {
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();
            const fileInput = document.getElementById('post-file-input');

            if (!title || !content) return alert('제목과 내용을 작성해 주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : `IP: ${userIp}`;

            try {
                await addDoc(collection(db, "posts"), {
                    title,
                    content,
                    imageUrl,
                    author: authorName,
                    likes: 0,
                    dislikes: 0,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-title-input').value = '';
                document.getElementById('post-content-input').value = '';
                fileInput.value = '';
                writeModal.style.display = 'none';
            } catch (e) {
                alert('게시 오류: ' + e.message);
            }
        });

        // 실시간 게시글 목록 불러오기
        const qPosts = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(qPosts, (snapshot) => {
            postsList.innerHTML = '';
            recentPostsSide.innerHTML = '';
            topPostsSide.innerHTML = '';

            if (snapshot.empty) {
                postsList.innerHTML = '<p style="text-align:center; padding: 2rem; color:#777;">작성된 글이 없습니다.</p>';
                recentPostsSide.innerHTML = '<div class="side-list-item">작성된 글이 없습니다.</div>';
                topPostsSide.innerHTML = '<div class="side-list-item">작성된 글이 없습니다.</div>';
                return;
            }

            let postsData = [];
            let count = 0;

            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                const formattedTime = formatDateShort(post.createdAt);
                postsData.push({ id: postId, ...post });

                const rowEl = document.createElement('div');
                rowEl.className = 'post-row';
                rowEl.innerHTML = `
                    <div class="post-row-title" onclick="openDetail('${postId}')">${escapeHtml(post.title)}</div>
                    <div class="post-row-author clickable-user" onclick="openUserProfile('${escapeHtml(post.author)}')">${escapeHtml(post.author)}</div>
                    <div class="post-row-date">${formattedTime}</div>
                `;
                postsList.appendChild(rowEl);

                if (count < 5) {
                    const sideEl = document.createElement('div');
                    sideEl.className = 'side-list-item';
                    sideEl.onclick = () => openDetail(postId);
                    sideEl.textContent = `• ${post.title}`;
                    recentPostsSide.appendChild(sideEl);
                }

                count++;
            });

            const sortedByLikes = [...postsData].sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 5);
            sortedByLikes.forEach(topPost => {
                const topEl = document.createElement('div');
                topEl.className = 'side-list-item';
                topEl.onclick = () => openDetail(topPost.id);
                topEl.textContent = `★ ${topPost.title} (${topPost.likes || 0})`;
                topPostsSide.appendChild(topEl);
            });
        });

        // 상세 페이지 열기
        window.openDetail = (postId) => {
            currentPostId = postId;
            feedView.style.display = 'none';
            detailView.style.display = 'block';

            onSnapshot(doc(db, "posts", postId), (docSnap) => {
                if (docSnap.exists()) {
                    const post = docSnap.data();
                    const formattedTime = formatDateShort(post.createdAt);
                    
                    document.getElementById('detail-content-area').innerHTML = `
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${escapeHtml(post.title)}</h2>
                        <div style="font-size:0.9rem; color:#666; margin-bottom: 1rem; border-bottom:1px solid #ddd; padding-bottom:0.5rem;">
                            작성자: <strong class="clickable-user" onclick="openUserProfile('${escapeHtml(post.author)}')">${escapeHtml(post.author)}</strong> | 작성일시: ${formattedTime} | 추천수: <strong style="color:#27ae60;">${post.likes || 0}</strong> | 비추천수: <strong style="color:#e74c3c;">${post.dislikes || 0}</strong>
                        </div>
                        <div style="white-space: pre-wrap; margin: 1rem 0; font-size: 1.05rem; line-height: 1.6;">${escapeHtml(post.content)}</div>
                        ${post.imageUrl ? `<img src="${post.imageUrl}" style="max-width:100%; border:2px solid #000; border-radius:4px; margin-top:1rem;">` : ''}
                    `;

                    document.getElementById('vote-like-count').textContent = post.likes || 0;
                    document.getElementById('vote-dislike-count').textContent = post.dislikes || 0;
                }
            });

            const voterKey = getVoterKey();
            onSnapshot(doc(db, "posts", postId, "votes", voterKey), (voteSnap) => {
                const likeBtn = document.getElementById('btn-vote-like');
                const dislikeBtn = document.getElementById('btn-vote-dislike');
                
                likeBtn.classList.remove('active');
                dislikeBtn.classList.remove('active');

                if (voteSnap.exists()) {
                    const voteType = voteSnap.data().type;
                    if (voteType === 'like') likeBtn.classList.add('active');
                    if (voteType === 'dislike') dislikeBtn.classList.add('active');
                }
            });

            loadComments(postId);
            window.scrollTo(0, 0);
        };

        // 실시간 댓글 불러오기
        function loadComments(postId) {
            const commentsListEl = document.getElementById('detail-comments-list');
            const qComments = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
            
            onSnapshot(qComments, (snap) => {
                commentsListEl.innerHTML = '';
                if(snap.empty) {
                    commentsListEl.innerHTML = '<p style="color:#888; font-size:0.95rem; padding: 0.5rem 0;">작성된 댓글이 없습니다.</p>';
                    return;
                }
                snap.forEach(cDoc => {
                    const c = cDoc.data();
                    const formattedTime = formatDateShort(c.createdAt);
                    const initial = c.author ? c.author.charAt(0).toUpperCase() : '?';

                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `
                        <div class="comment-avatar" onclick="openUserProfile('${escapeHtml(c.author)}')">${initial}</div>
                        <div style="flex:1;">
                            <div style="font-size:0.85rem; font-weight:bold; margin-bottom:0.2rem;">
                                <span class="clickable-user" onclick="openUserProfile('${escapeHtml(c.author)}')">${escapeHtml(c.author)}</span> 
                                <span style="font-weight:normal; color:#888; font-size:0.75rem;">${formattedTime}</span>
                            </div>
                            <div style="white-space: pre-wrap; font-size:0.95rem;">${escapeHtml(c.text)}</div>
                            ${c.imageUrl ? `<img src="${c.imageUrl}" style="max-width:150px; border:1px solid #000; border-radius:4px; margin-top:0.4rem; display:block;">` : ''}
                        </div>
                    `;
                    commentsListEl.appendChild(div);
                });
            });
        }

        // 댓글 등록
        document.getElementById('btn-submit-comment').addEventListener('click', async () => {
            if (!currentPostId) return;
            const textInput = document.getElementById('comment-text-input');
            const fileInput = document.getElementById('comment-file-input');
            const text = textInput.value.trim();

            if (!text && (!fileInput.files || !fileInput.files[0])) return alert('댓글 내용을 입력하거나 이미지를 첨부해주세요.');

            let imageUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await fileToBase64(fileInput.files[0]);
                } catch (err) {
                    alert('이미지 변환 실패');
                    return;
                }
            }

            const authorName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : `IP: ${userIp}`;

            try {
                await addDoc(collection(db, "posts", currentPostId, "comments"), {
                    text,
                    imageUrl,
                    author: authorName,
                    createdAt: serverTimestamp()
                });
                textInput.value = '';
                fileInput.value = '';
            } catch (e) {
                alert('댓글 작성 실패: ' + e.message);
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
